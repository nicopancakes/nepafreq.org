<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporarily Unavailable</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px 25px;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 32px;
    }

    p {
      margin: 8px 0;
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 25px;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon"></div>

    <h1>Website Temporarily Unavailable</h1>

    <p>
      Our website is currently down for maintenance due to a legal matter.
    </p>

    <div class="notice">
      <p>We’re working to resolve the issue and expect to be back soon.</p>
      <p>Thank you for your patience and understanding.</p>
    </div>
  </main>
</body>
</html>
